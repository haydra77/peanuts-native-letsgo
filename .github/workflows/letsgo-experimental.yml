name: Pokémon Let's Go experimental scaffold

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/pokemon-lets-go-eevee-scaffold
    paths:
      - 'experiments/pokemon-lets-go-eevee/**'
      - '.github/workflows/letsgo-experimental.yml'

permissions:
  contents: read

concurrency:
  group: letsgo-experimental-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-scaffold:
    name: Validate metadata-only scaffold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Validate private-data-free scaffold
        run: python3 experiments/pokemon-lets-go-eevee/validate.py
      - name: Check existing repository profiles
        run: sh peanuts/scripts/check-profiles.sh
      - name: Check runtime profile generation
        run: sh peanuts/scripts/check-runtime-profile.sh
